apiVersion: apps/v1
kind: Deployment
metadata:
  name: otus-health-checker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: otus-health-checker
  template:
    metadata:
      labels:
        app: otus-health-checker
    spec:
      containers:
        - name: health-checker
          image: genatsvale/otus-health-checker:hw3
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
